name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: todo-ci-checks
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Enable the pinned Yarn version
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check lint
        run: yarn lint
      - name: Check TypeScript
        run: yarn check-types
      - name: Check frontend formatting
        run: yarn workspace web format:check
      - name: Start test MongoDB
        run: docker compose up -d --wait --wait-timeout 120 mongodb
      - name: Run frontend and backend tests
        run: yarn test
      - name: Build workspaces
        run: yarn build
      - name: Show database logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100 mongodb
      - name: Clean up test database
        if: always()
        run: docker compose down --volumes --remove-orphans

  compose:
    name: Docker Compose smoke test
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: todo-ci-compose
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js for the smoke test
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the complete stack
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Check app, API documentation, and TODO operations
        run: node scripts/smoke-test.mjs
      - name: Show stack status and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=150
      - name: Clean up the stack
        if: always()
        run: docker compose down --volumes --remove-orphans
